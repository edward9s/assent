# agents 調度器設定。工作資料夾由命令列明示或任務檔現況自動推導。
# 所有相對路徑以專案根目錄(= .agents 的上層)為基準。

[watchdog]
stall_minutes = 30                # session 連續無輸出幾分鐘判定卡死;0 = 關閉

[run]
retry_per_task = 1                # 驗收失敗後的重試次數
quota_poll_minutes = 30           # 無法解析額度重置時間時的輪詢間隔

[adapter]
name = "claude"                   # "claude" 或 "codex"

[adapter.claude]
command = "claude"
# bypassPermissions:執行 AI 需能跑測試自測自修、寫 .agents/ 內自己的 t/r 檔收尾;
# acceptEdits 會卡命令執行審批(headless 無人可批)。客觀閘門(scope 檢查、verify、
# 檢查點)不依賴 session 權限,信任等級實質同本地開發。要收緊可改回 acceptEdits
# 並搭配 --allowedTools 逐項放行(如 "Bash(python:*)")。
extra_args = ["--permission-mode", "bypassPermissions"]
# 抽象檔位 -> CLI --model 參數(任務檔只寫 prime/core/lite)
[adapter.claude.models]
prime = "fable"
core  = "opus"
lite  = "sonnet"
# 任務檔未標 effort 時各檔位的預設值(low/medium/high)
[adapter.claude.default_effort]
prime = "high"
core  = "high"
lite  = "medium"

[adapter.codex]
command = "codex"
# danger-full-access:workspace-write 沙箱有兩個實測炸點——(1)tempfile 型測試
# 寫系統暫存目錄被拒;(2)被 .gitignore 的工作資料夾會被劃成「專案外」唯讀,
# 執行 AI 改不了自己任務檔的 status,任務全數假性 BLOCKED。客觀閘門不受影響。
# 要收緊可改回 workspace-write 並以 writable_roots 放行暫存目錄(僅解炸點 1)。
extra_args = ["--sandbox", "danger-full-access"]
[adapter.codex.models]
prime = "gpt-5.6-sol"
core  = "gpt-5.6-terra"
lite  = "gpt-5.6-luna"
[adapter.codex.default_effort]
prime = "high"
core  = "medium"
lite  = "low"

[prompt]
# 可覆寫預設提示詞模板;可用變數:{agents_md_path} {instructions_path} {task_path}
# {journal_path} {verify_command} {task_id} {task_title} {agent} {requested_model}
# {agent} 是 codex 或 claude;{requested_model} 是本次傳給 AI CLI 的 --model 值。
# template = """..."""
