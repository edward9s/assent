# agents scheduler configuration. The work folder is stated explicitly on the
# command line or derived from current task-file state.
# All relative paths are based on the project root (= the parent of .agents).

[watchdog]
stall_minutes = 30                # minutes of no session output before it is judged stalled; 0 = off

[run]
retry_per_task = 1                # number of retries after a verification failure
quota_poll_minutes = 30           # polling interval when the quota reset time cannot be parsed

[adapter]
name = "claude"                   # "claude" or "codex"

[adapter.claude]
command = "claude"
# Extra arguments passed to the Claude CLI; the default skips the interactive
# permission prompt for unattended execution.
# If switching to acceptEdits, use --allowedTools to permit the verification
# command and the tools needed for task closeout.
extra_args = ["--permission-mode", "bypassPermissions"]
# abstract tier -> CLI --model argument (task files write only prime/core/lite)
[adapter.claude.models]
prime = "fable"
core  = "opus"
lite  = "sonnet"
# default value per tier when a task file states no effort (low/medium/high)
[adapter.claude.default_effort]
prime = "high"
core  = "high"
lite  = "medium"
# abstract effort -> actual CLI value; lookup order: tier subsection > flat > identity.
# both layers and every key are optional; omit everything for low/medium/high identity pass-through.
# [adapter.claude.efforts]
# low = "low"
# medium = "medium"
# high = "high"
# [adapter.claude.efforts.lite]
# high = "max"                  # overrides only lite/high, other tiers unaffected

[adapter.codex]
command = "codex"
# Extra arguments passed to the Codex CLI; the default permits writing to the
# system temp directory and the main-tree `.agents/`.
# See "Hard requirements for the adapter sandbox" in format.md for the permission
# needs and the limits when tightening.
extra_args = ["--sandbox", "danger-full-access"]
[adapter.codex.models]
prime = "gpt-5.6-sol"
core  = "gpt-5.6-terra"
lite  = "gpt-5.6-luna"
[adapter.codex.default_effort]
prime = "high"
core  = "medium"
lite  = "low"
# [adapter.codex.efforts]
# low = "low"
# medium = "medium"
# high = "high"
# [adapter.codex.efforts.prime]
# high = "xhigh"                # vendor-specific values appear only in the config translation layer

[prompt]
# Overrides the default prompt template; available variables: {agents_md_path} {instructions_path} {task_path}
# {journal_path} {verify_command} {task_id} {task_title} {agent} {requested_model}
# {effort} {requested_effort}
# {agent} is codex or claude; {requested_model} is the --model value passed to the AI CLI this run.
# {effort} is the abstract low/medium/high; {requested_effort} is the actual CLI value, empty string when not passed.
# template = """..."""
