[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "assent"
version = "0.1.0a1"
description = "AI plan format + zero-token automatic scheduler (zero third-party dependencies)"
requires-python = ">=3.11"

[project.scripts]
assent = "assent.__main__:main"

[tool.setuptools.packages.find]
include = ["assent*"]

[tool.setuptools.package-data]
assent = ["templates/*"]
