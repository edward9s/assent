[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "assent"
version = "0.1.0a1"
description = "AI plan format + automatic scheduler"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
assent = "assent.__main__:main"

[tool.setuptools.packages.find]
include = ["assent*"]

[tool.setuptools.package-data]
assent = ["templates/*"]
