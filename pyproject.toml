[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agents"
version = "0.1.0"
description = "AI 計畫格式 + 零 token 自動調度器(零第三方依賴)"
requires-python = ">=3.11"

[project.scripts]
agents = "agents.__main__:main"

[tool.setuptools.packages.find]
include = ["agents*"]

[tool.setuptools.package-data]
agents = ["templates/*"]
