name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    if: github.event_name == 'release' || github.event.head_commit.message == 'chore: republish 0.1.0a12 to PyPI'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && 'v0.1.0a12' || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify the release tag
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          metadata = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )
          expected = "v" + metadata["project"]["version"]
          actual = (
              "v0.1.0a12"
              if os.environ["GITHUB_EVENT_NAME"] == "push"
              else os.environ["GITHUB_REF_NAME"]
          )
          if actual != expected:
              raise SystemExit(
                  f"Release tag {actual!r} must match project version {expected!r}."
              )

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/assent
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
