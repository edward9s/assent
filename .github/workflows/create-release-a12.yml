name: Create v0.1.0a12 release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/create-release-a12.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## What's Changed

          - Expand ignored inputs from directories to reviewed files, replacing `ignored-dirs` with `ignored-inputs` and advancing plan and batch receipt schemas to version 3.
          - Move runtime-test main-command discovery into the finite runtime workflow, require explicit confirmation before installation or production execution, and store the result in `.assent/_runtime_test.toml` instead of `[runtime_test].command`.
          - Harden workflow state handling by restoring scheduler-owned role state, safely discarding obsolete integration cursors, and preserving rejection evidence before worktree deletion.
          - Simplify the English and Traditional Chinese getting-started documentation and separate human workflow steps from AI control commands.

          **Full Changelog**: https://github.com/edward9s/assent/compare/v0.1.0a11...v0.1.0a12
          EOF
          gh release create v0.1.0a12 \
            --repo edward9s/assent \
            --target e041c28bd0d7a6573d9364987ba6cd0a8e15f81c \
            --title v0.1.0a12 \
            --notes-file /tmp/release-notes.md \
            --prerelease
