name: Fix v0.1.0a12 release metadata

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-release-latest-a12.yml"

permissions:
  contents: write

jobs:
  fix-release:
    runs-on: ubuntu-latest
    steps:
      - name: Mark v0.1.0a12 as a normal latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v0.1.0a12 \
            --repo edward9s/assent \
            --prerelease=false \
            --latest
