[adapter]
# One adapter name or a non-empty list of names. A list rotates in order and
# wraps around; a single string has the same behavior as a one-item list.
name = ["claude", "codex"]            # "claude", "codex", or "antigravity"

# Each tier names one complete invocation: "<model>/<effort>". The model is
# everything before the first "/", the effort everything after it, and both are
# passed to the vendor CLI exactly as written. Omit the separator to pass no
# effort argument at all and inherit the vendor CLI's own default. A model name
# may therefore not contain "/"; a second separator is refused at config load.

[adapter.claude]
command = "claude"
# Extra arguments passed to the Claude CLI; the default skips the interactive
# permission prompt for unattended execution.
# If switching to acceptEdits, use --allowedTools to permit the verification
# command and the tools needed for task closeout.
extra_args = ["--permission-mode", "bypassPermissions"]
# abstract tier -> CLI arguments (an assent.toml role may name a vendor selection
# directly instead, which bypasses this table)
[adapter.claude.models]
prime = "opus/high"
core  = "opus/medium"
lite  = "sonnet/high"

[adapter.codex]
command = "codex"
# Extra arguments passed to the Codex CLI; the default permits writing to the
# system temp directory and the main-tree `.assent/`.
# See "Hard requirements for the adapter sandbox" in format.md for the permission
# needs and the limits when tightening.
extra_args = ["--sandbox", "danger-full-access"]
[adapter.codex.models]
prime = "gpt-5.6-sol/medium"
core  = "gpt-5.6-luna/max"
lite  = "gpt-5.6-luna/xhigh"

[adapter.antigravity]
command = "agy"
# Antigravity requires an interactive Google sign-in before unattended use. Start
# `agy` and complete the browser or printed-URL sign-in before `assent run`.
# See Google's official Antigravity CLI installation and authentication docs:
# https://antigravity.google/docs/cli/install
# Sign out with `/logout` only at the interactive AGY prompt; it is not a shell
# subcommand. Assent uses credentials already held by AGY and does not open the
# login browser, read or modify credentials, switch Google accounts, or alter
# workspace trust. Headless execution cannot answer permission prompts, so
# unattended runs use --dangerously-skip-permissions.
extra_args = ["--dangerously-skip-permissions"]
# Print mode timeout: how long AGY will wait for a single --print invocation.
# Do not set lower than your longest expected task time. The watchdog timeout
# (in the [watchdog] section of assent.toml) is independent and limits total
# session time. Antigravity 1.1.5+ defaults to 5 minutes; Assent requires this
# to be explicit.
print_timeout_minutes = 120
# These must be base family slugs that AGY 1.1.5+ accepts, each paired with an
# effort that family actually supports; verify with `agy models`. Gemini 3.5
# Flash has no high, so the lite tier names that family's ceiling directly
# rather than a value the CLI would refuse.
[adapter.antigravity.models]
prime = "gemini-3.1-pro/high"     # Gemini 3.1 Pro (low, high only)
core  = "gemini-3.7-flash/high"   # Gemini 3.7 Flash (low, medium, high)
lite  = "gemini-3.6-flash/high"   # Gemini 3.6 Flash (low, medium, high)
