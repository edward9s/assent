# assent scheduler configuration. The work folder is stated explicitly on the
# command line or derived from current task-file state.
# All relative paths are based on the project root (= the parent of .assent).

[watchdog]
stall_minutes = 30                # minutes of no session output before it is judged stalled; 0 = off

[run]
retry_per_task = 1                # number of retries after a verification failure
quota_poll_minutes = 30           # polling interval when the quota reset time cannot be parsed

[verification]
# Who refreshes a folder's verification receipt.
# "manual" (default): run closeout does not build a candidate or run the full
# suite; it prints the next step and the receipt comes only from an explicit
# `assent verify [--batch]`. Best for batch workflows, where one batch
# verification replaces N per-folder ones.
# "auto": run closeout refreshes a stale receipt itself, so a run ends knowing
# whether the integration candidate is green.
# receipt_refresh = "manual"

[adapter]
name = "claude"                   # "claude", "codex", or "antigravity"

[adapter.claude]
command = "claude"
# Extra arguments passed to the Claude CLI; the default skips the interactive
# permission prompt for unattended execution.
# If switching to acceptEdits, use --allowedTools to permit the verification
# command and the tools needed for task closeout.
extra_args = ["--permission-mode", "bypassPermissions"]
# abstract tier -> CLI --model argument (task files write only prime/core/lite)
[adapter.claude.models]
prime = "fable"
core  = "opus"
lite  = "sonnet"
# default value per tier when a task file states no effort (heavy/normal/slight)
[adapter.claude.default_effort]
prime = "heavy"
core  = "heavy"
lite  = "normal"
# abstract effort -> actual CLI value; lookup order: tier subsection > flat > built-in baseline.
# built-in baseline: heavy = "high", normal = "medium", slight = "low".
# Abstract words are not legal CLI values, so they are never sent directly.
# [adapter.claude.efforts]
# heavy = "high"
# normal = "medium"
# slight = "low"
# [adapter.claude.efforts.lite]
# heavy = "max"                  # overrides only lite/heavy, other tiers unaffected

[adapter.codex]
command = "codex"
# Extra arguments passed to the Codex CLI; the default permits writing to the
# system temp directory and the main-tree `.assent/`.
# See "Hard requirements for the adapter sandbox" in format.md for the permission
# needs and the limits when tightening.
extra_args = ["--sandbox", "danger-full-access"]
[adapter.codex.models]
prime = "gpt-5.6-sol"
core  = "gpt-5.6-terra"
lite  = "gpt-5.6-luna"
[adapter.codex.default_effort]
prime = "heavy"
core  = "normal"
lite  = "slight"
# [adapter.codex.efforts]
# heavy = "high"
# normal = "medium"
# slight = "low"
# [adapter.codex.efforts.prime]
# heavy = "xhigh"                # vendor-specific values appear only in the config translation layer

[adapter.antigravity]
command = "agy"
# Antigravity is a locally-installed CLI that requires `agy auth login` once per machine.
# Headless execution cannot answer permission prompts, so unattended runs use
# --dangerously-skip-permissions. Assent will not modify your ~/.gemini/ settings,
# install Antigravity, open a login browser, or change your workspace trust.
extra_args = ["--dangerously-skip-permissions"]
# Print mode timeout: how long AGY will wait for a single --print invocation.
# Do not set lower than your longest expected task time. The watchdog timeout
# (in the [watchdog] section above) is independent and limits total session time.
# Antigravity 1.1.5+ defaults to 5 minutes; Assent requires this to be explicit.
print_timeout_minutes = 120
[adapter.antigravity.models]
# These must be base family slugs that AGY 1.1.5+ accepts; verify with `agy models`
prime = "gemini-3.1-pro"     # Gemini 3.1 Pro (low, high only)
core  = "gemini-3.6-flash"   # Gemini 3.6 Flash (low, medium, high)
lite  = "gemini-3.5-flash"   # Gemini 3.5 Flash (low, medium; no high)
[adapter.antigravity.default_effort]
prime = "heavy"
core  = "heavy"
lite  = "heavy"
# Effort translation: Gemini 3.1 Pro does not support medium, so map normal up to high
# (quality-first, never silent downgrade). Gemini 3.5 Flash has no high, so map heavy
# to medium (the family's ceiling), visible in the config for auditability.
[adapter.antigravity.efforts.prime]
normal = "high"
[adapter.antigravity.efforts.lite]
heavy = "medium"

[prompt]
# Overrides the default prompt template; available variables: {agents_md_path} {instructions_path} {task_path}
# {journal_path} {verify_command} {task_id} {task_title} {agent} {requested_model}
# {effort} {requested_effort}
# {agent} is codex or claude; {requested_model} is the --model value passed to the AI CLI this run.
# {effort} is the abstract heavy/normal/slight; {requested_effort} is the actual CLI value, empty string when not passed.
# template = """..."""
