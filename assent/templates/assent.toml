# assent scheduler configuration. `assent init` installs this file once as
# ~/.assent/assent.toml, where it applies to every project on this machine, and
# later inits only add settings a new version brings; your own values and
# comments are never rewritten. A project may still keep its own
# .assent/assent.toml, which overrides this file for that project alone.
# The plan is stated explicitly on the command line or derived from
# current task-file state.
# All relative paths are based on the project root (= the parent of .assent).

[watchdog]
stall_minutes = 0                 # minutes of no session output before it is judged stalled; 0 = off

[run]
retry_per_task = 1                # number of retries after a verification failure
quota_poll_minutes = 30           # polling interval when the quota reset time cannot be parsed
rotation_poll_minutes = 1         # polling interval after every adapter in the rotation is quota-exhausted

[verification]
# Who refreshes a plan's verification receipt.
# "manual" (default): run closeout does not build a candidate or run the full
# suite; it prints the next step and the receipt comes only from an explicit
# `assent verify [--batch]`. Best for selection workflows, where one selection
# verification replaces N individual plan verification runs.
# "auto": run closeout refreshes a stale receipt itself, so a run ends knowing
# whether the integration candidate is green.
receipt_refresh = "manual"

# The default workflow is active. `run --auto-fix` remains the invocation-level
# opt-in for plan review and bounded repair.
# Abilities are atomic and reusable; roles compose them for each workflow step.
# prompt: instructions added to a session that uses this ability.
# writes: whether that session may edit source inside its scheduler-owned scope.
# produces_verdict: use the scheduler's structured review-verdict protocol.
[abilities.write_tests]
prompt = "Write or update tests that prove the supplied requirements."
writes = true
[abilities.implement_source]
prompt = "Implement the supplied requirements and satisfy the supplied focused checks."
writes = true
[abilities.review]
prompt = "Review the supplied change and evidence and return the required verdict."
writes = false
produces_verdict = true
[abilities.fix]
prompt = "Repair authorized blocking findings within the assigned scope."
writes = true
# ability: ordered ability names composed into this role.
# model/effort: optional abstract execution tiers for this role.
[roles.implementer]
ability = ["write_tests", "implement_source"]
[roles.reviewer]
ability = ["review"]
model = "prime"
effort = "heavy"
[roles.fixer]
ability = ["fix"]
model = "prime"
effort = "heavy"
[roles.reviewer_fixer]
ability = ["review", "fix"]
model = "prime"
effort = "heavy"
# Actions are scheduler-owned objective gates, not agent abilities.
# focused_test is legal only in workflow.task. It runs the current task's
# focused verify command outside the AI session and binds the result to source.
# full_test is legal only in workflow.task and workflow.plan. It runs the full
# suite against the current source worktree without an integration candidate or
# verification receipt.
# full_verify is legal only in workflow.selection. It verifies the reconstructed
# integration candidate and writes the matching plan or exact-selection receipt.
# An action accepts only its action name: no role, adapter, model, or effort.
# role: a name defined under [roles]; adapter: the verdict role's AI provider.
# After full_verify: one verdict role, an optional writes-only fixer, then
# another full_verify. Invalid repair positions fail before verification starts.
[workflow]
task = [{ role = "implementer" }, { action = "focused_test" }]
plan = []
selection = [{ role = "reviewer_fixer", adapter = "codex" }, { role = "reviewer_fixer", adapter = "codex" }, { action = "full_verify" }, { role = "reviewer", adapter = "codex" }, { role = "fixer" }, { action = "full_verify" }]
# Roles before the first action are the bounded per-plan review sequence. Roles
# after full_verify repair only its durable failure evidence. The fixer is used
# for candidate conflicts; verifier failures use the implicated task profiles.
