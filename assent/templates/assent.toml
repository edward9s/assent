# Shared Assent settings. A project's .assent/assent.toml may override them.
# The Configuration guide documents workflow structure and alternatives.

[watchdog]
stall_minutes = 0                 # 0 disables the session-output watchdog

[run]
quota_poll_minutes = 30           # polling interval when the quota reset time cannot be parsed
rotation_poll_minutes = 1         # polling interval after every adapter in the rotation is quota-exhausted

# Abilities define session responsibility and write authority. Names have no
# engine meaning.
[abilities.write_tests]
prompt = "Write or update the smallest decisive tests that prove the supplied behavioral requirements. Prefer observable semantics and invariants over the current representation: do not treat template example names, default values, serialization, ordering, or internal helpers as contracts unless a requirement explicitly makes them public. For configurable behavior, when applicable use an alternate valid combination, a semantics-preserving input transformation, or rejection of an invalid combination. Prove that behavior follows the declared semantics rather than a packaged example. Do not weaken existing tests or mock away the behavior being proved."
writes = true
[abilities.implement_source]
prompt = "Implement the supplied requirements under the governing design principles: use the smallest architecture and fewest states that make invalid behavior difficult to form, one term per actual mechanism, and failure at the first authoritative boundary instead of compatibility or masking. Fix production behavior and satisfy the supplied focused checks; do not weaken, narrow, delete, or rewrite tests merely to make a check pass."
writes = true
[abilities.runtime_repair]
prompt = "Repair the runtime-test failure in the candidate worktree. You may edit any ordinary project source, tests, fixtures, project configuration, or documentation needed to correct the root cause. Do not run any command, Git, or Assent operation; do not modify task contracts, journals, scheduler state, receipts, Git state, acceptance state, or other control state; and do not declare the runtime test passed."
writes = true
[abilities.task_review]
prompt = "Review the current task against its stated behavior and focused_test evidence. Apply the governing design principles: require the smallest architecture and fewest states, one term per actual mechanism, and failure at the first authoritative boundary instead of compatibility or masking. Treat avoidable state, branching, indirection, tracking, and recovery machinery as substantive defects when a direct invariant can remove them. Do not invent requirements. When relevant test changes are part of the supplied evidence, do not accept tests that merely mirror implementation constants, template examples, or incidental representation instead of proving the cited requirement."
writes = false
[abilities.task_fix]
prompt = "Repair the supplied task evidence across the candidate worktree under the governing design principles: use the smallest architecture and fewest states, one term per actual mechanism, and failure at the first authoritative boundary instead of compatibility or masking. Treat the authoritative requirements as the source of truth: determine whether each defect is in the tests or the implementation, then correct whichever is wrong. Preserve correct tests; never weaken, narrow, delete, rewrite, bypass, or mock them merely to make a check pass. Remove the failure mechanism instead of surrounding it with another guard when a direct invariant can make it impossible. Do not create tasks or requirements."
writes = true
[abilities.plan_quality_review]
prompt = "Review the completed cumulative worktree once for conformance to the existing plan before focused_sweep. Apply the governing design principles: require the smallest architecture and fewest states, one term per actual mechanism, and failure at the first authoritative boundary instead of compatibility or masking. Treat avoidable state, branching, indirection, tracking, and recovery machinery as substantive defects when a direct invariant can remove them. Inspect cross-task interactions and whether changed tests prove cited requirements through observable semantics. Do not accept tests that merely mirror implementation constants, template examples, or incidental representation instead of proving the cited requirement. Do not invent requirements or conduct a repository-wide debt search."
writes = false
[abilities.plan_review]
prompt = "Review focused_sweep evidence and the cumulative worktree against the existing plan. Apply the governing design principles: require the smallest architecture and fewest states, one term per actual mechanism, and failure at the first authoritative boundary instead of compatibility or masking. Treat avoidable state, branching, indirection, tracking, and recovery machinery as substantive defects when a direct invariant can remove them. Include cross-task interactions and concrete regressions. When relevant test changes are part of the supplied evidence, do not accept tests that merely mirror implementation constants, template examples, or incidental representation instead of proving the cited requirement."
writes = false
[abilities.plan_fix]
prompt = "Repair the supplied plan evidence across the candidate worktree under the governing design principles: use the smallest architecture and fewest states, one term per actual mechanism, and failure at the first authoritative boundary instead of compatibility or masking. Treat the authoritative requirements as the source of truth: determine whether each defect is in the tests or the implementation, then correct whichever is wrong. Preserve correct tests; never weaken, narrow, delete, rewrite, bypass, or mock them merely to make a check pass. Remove the failure mechanism instead of adding ownership, routing, tracking, or recovery when a direct invariant can make it impossible. Do not create tasks or requirements."
writes = true
[abilities.integration_review]
prompt = "Review the exact selection's candidate-conflict or full_verify evidence. Apply the governing design principles: require the smallest architecture and fewest states, one term per actual mechanism, and failure at the first authoritative boundary instead of compatibility or masking. Treat avoidable state, branching, indirection, tracking, and recovery machinery as substantive defects when a direct invariant can remove them. Identify every integration blocker without shrinking the selection, accepting a prefix, or inventing requirements. When relevant test changes are part of the supplied evidence, do not accept tests that merely mirror implementation constants, template examples, or incidental representation instead of proving the cited requirement."
writes = false
[abilities.integration_fix]
prompt = "Repair the supplied integration evidence in the scheduler-provided workspace or workspaces while preserving the exact selection under the governing design principles: use the smallest architecture and fewest states, one term per actual mechanism, and failure at the first authoritative boundary instead of compatibility or masking. Treat the authoritative requirements as the source of truth: determine whether each defect is in the tests or the implementation, then correct whichever is wrong. Preserve correct tests; never weaken, narrow, delete, rewrite, bypass, or mock them merely to make a check pass. Remove the failure mechanism instead of adding ownership, routing, tracking, or recovery when a direct invariant can make it impossible. Do not run Git, Assent, focused tests, full verification, or accept."
writes = true

# Roles compose abilities and may select an abstract model tier. The template
# defines repair roles that combine inspection and writing. Each invocation is
# one session, and the following scheduler action decides whether the candidate
# is correct.
[roles.implementer]
ability = ["write_tests", "implement_source"]
#model = "lite"
[roles.runtime_repairer]
ability = ["runtime_repair"]
model = "core"
[roles.tests_writer]
ability = ["write_tests"]
#model = "lite"
[roles.source_implementer]
ability = ["implement_source"]
#model = "lite"
[roles.task_repairer]
ability = ["task_review", "task_fix"]
#model = "core"
[roles.plan_quality_repairer]
ability = ["plan_quality_review", "plan_fix"]
model = "prime"
[roles.plan_repairer]
ability = ["plan_review", "plan_fix"]
model = "core"
[roles.integration_repairer]
ability = ["integration_review", "integration_fix"]
model = "prime"

# A role may omit adapter for the global rotation, name one fixed adapter, or
# name an ordered adapter list for availability fallback. A passing scheduler
# action ends its layer. Failure advances to the next configured repair role,
# then the next action rechecks the result.
#
# A role is one session. Sessions run in array order and do not converse; the
# preceding session output and action evidence are inputs to the next step.
[workflow]
task = [
  { role = "implementer", adapter = ["codex", "claude"] },
  { action = "focused_test" },
  { role = "task_repairer", adapter = ["claude", "codex"] },
  { action = "focused_test" },
  { role = "task_repairer", adapter = ["claude", "codex"] },
  { action = "focused_test" },
  { role = "task_repairer", adapter = ["claude", "codex"] },
  { action = "focused_test" },
]
plan = [
  { role = "plan_quality_repairer", adapter = ["claude", "codex"] },
  { action = "focused_sweep" },
  { role = "plan_repairer", adapter = ["claude", "codex"] },
  { action = "focused_sweep" },
  { role = "plan_repairer", adapter = ["claude", "codex"] },
  { action = "focused_sweep" },
  { role = "plan_repairer", adapter = ["claude", "codex"] },
  { action = "focused_sweep" },
]
integration = [
  { action = "full_verify" },
  { role = "integration_repairer", adapter = ["claude", "codex"] },
  { action = "full_verify" },
  { role = "integration_repairer", adapter = ["claude", "codex"] },
  { action = "full_verify" },
  { role = "integration_repairer", adapter = ["claude", "codex"] },
  { action = "full_verify" },
]
runtime_test = [
  { action = "runtime_test" },
  { role = "runtime_repairer", adapter = ["claude", "codex"] },
  { action = "runtime_test" },
  { role = "runtime_repairer", adapter = ["claude", "codex"] },
  { action = "runtime_test" },
  { role = "runtime_repairer", adapter = ["claude", "codex"] },
  { action = "runtime_test" },
]
