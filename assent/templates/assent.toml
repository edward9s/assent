# Shared Assent settings. A project's .assent/assent.toml may override them.
# The Configuration guide documents workflow structure and alternatives.

[watchdog]
stall_minutes = 0                 # 0 disables the session-output watchdog

[run]
retry_per_task = 1                # number of retries after a verification failure
quota_poll_minutes = 30           # polling interval when the quota reset time cannot be parsed
rotation_poll_minutes = 1         # polling interval after every adapter in the rotation is quota-exhausted

# Abilities define session responsibility and authority. Names have no engine
# meaning; writes and produces_verdict do.
[abilities.write_tests]
prompt = "Write or update tests that prove the supplied behavioral requirements. Prefer observable semantics and invariants over the current representation: do not treat template example names, default values, serialization, ordering, or internal helpers as contracts unless a requirement explicitly makes them public. For configurable behavior, when applicable use the smallest decisive evidence: an alternate valid combination, a semantics-preserving input transformation, or rejection of an invalid combination. Prove that behavior follows the declared semantics rather than a packaged example. Do not weaken existing tests or mock away the behavior being proved."
writes = true
[abilities.implement_source]
prompt = "Implement the supplied requirements and satisfy the supplied focused checks. Fix production behavior; do not weaken, narrow, delete, or rewrite tests merely to make a check pass."
writes = true
[abilities.task_review]
prompt = "Resolve only the current task's BLOCKED or focused_test evidence. Diagnose a task-local planning omission; when one exact scope path was omitted, identify it without inventing requirements. When relevant test changes are part of the supplied failure evidence, do not accept tests that merely mirror implementation constants, template examples, or incidental representation instead of proving the cited requirement."
writes = false
produces_verdict = true
[abilities.task_fix]
prompt = "Repair every authorized task-local finding, including an exact omitted scope path. Fix production behavior; do not weaken, narrow, delete, or rewrite tests merely to make a check pass. Do not create tasks or requirements."
writes = true
[abilities.plan_quality_review]
prompt = "Review the completed cumulative worktree once for conformance to the existing plan before focused_sweep. Inspect cross-task interactions and whether changed tests prove cited requirements through observable semantics. Do not accept tests that merely mirror implementation constants, template examples, or incidental representation instead of proving the cited requirement. Report only blocking correctness, safety, unmet-requirement, or focused-test-gap findings tied to an existing task. Do not invent requirements or conduct a repository-wide debt search."
writes = false
produces_verdict = true
[abilities.plan_review]
prompt = "Review only focused_sweep failure evidence to decide whether the cumulative worktree conforms to the existing plan, including cross-task interactions and concrete regressions. When relevant test changes are part of the supplied failure evidence, do not accept tests that merely mirror implementation constants, template examples, or incidental representation instead of proving the cited requirement."
writes = false
produces_verdict = true
[abilities.plan_fix]
prompt = "Repair every authorized plan-level finding through its implicated existing tasks. Fix production behavior; do not weaken, narrow, delete, or rewrite tests merely to make a check pass. Do not create tasks or requirements."
writes = true
[abilities.integration_review]
prompt = "Review only the exact selection's candidate-conflict or full_verify failure evidence. Identify every integration blocker without shrinking the selection, accepting a prefix, or inventing requirements. When relevant test changes are part of the supplied failure evidence, do not accept tests that merely mirror implementation constants, template examples, or incidental representation instead of proving the cited requirement."
writes = false
produces_verdict = true
[abilities.integration_fix]
prompt = "Repair every authorized integration finding in the scheduler-provided workspaces while preserving the exact selection. Fix production behavior; do not weaken, narrow, delete, or rewrite tests merely to make a check pass. Do not run Git, Assent, focused tests, full verification, or accept."
writes = true

# Roles compose abilities and may select an abstract model tier. The template
# defines only its recommended split repair roles; custom settings may still
# compose a writable verdict role when the combined form is intentional.
#
# Every verdict role is prime: a wrong verdict either passes broken work or blocks
# good work, and the strict output it must return is what weaker models miss first.
# Every pure writer is lite to conserve the expensive-model budget; the next
# scheduler action checks its result.
[roles.implementer]
ability = ["write_tests", "implement_source"]
model = "lite"
[roles.tests_writer]
ability = ["write_tests"]
model = "lite"
[roles.source_implementer]
ability = ["implement_source"]
model = "lite"
[roles.task_reviewer]
ability = ["task_review"]
model = "prime"
[roles.task_fixer]
ability = ["task_fix"]
model = "lite"
[roles.plan_quality_reviewer]
ability = ["plan_quality_review"]
model = "prime"
[roles.plan_reviewer]
ability = ["plan_review"]
model = "prime"
[roles.plan_fixer]
ability = ["plan_fix"]
model = "lite"
[roles.integration_reviewer]
ability = ["integration_review"]
model = "prime"
[roles.integration_fixer]
ability = ["integration_fix"]
model = "lite"

# A role may omit adapter for the global rotation, name one fixed adapter, or
# name an ordered adapter list for availability fallback. A passing scheduler
# action ends its layer. Failure advances to the next configured repair role,
# then the next action rechecks the result.
#
# Every repair layer ships split so ownership and scope are validated before a
# fixer writes. The task implementer remains one session.
[workflow]
task = [
  { role = "implementer", adapter = ["codex", "claude"] },
  { action = "focused_test" },
  { role = "task_reviewer", adapter = ["claude", "codex"] },
  { role = "task_fixer", adapter = ["codex", "claude"] },
  { action = "focused_test" },
]
plan = [
  { role = "plan_quality_reviewer", adapter = ["claude", "codex"] },
  { role = "plan_fixer", adapter = ["codex", "claude"] },
  { action = "focused_sweep" },
  { role = "plan_reviewer", adapter = ["claude", "codex"] },
  { role = "plan_fixer", adapter = ["codex", "claude"] },
  { action = "focused_sweep" },
  { role = "plan_reviewer", adapter = ["claude", "codex"] },
  { role = "plan_fixer", adapter = ["codex", "claude"] },
  { action = "focused_sweep" },
]
integration = [
  { action = "full_verify" },
  { role = "integration_reviewer", adapter = ["claude", "codex"] },
  { role = "integration_fixer", adapter = ["codex", "claude"] },
  { action = "full_verify" },
]
